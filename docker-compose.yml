services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: blackbox
      POSTGRES_PASSWORD: blackbox
      POSTGRES_DB: blackbox
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blackbox"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  crawler:
    build: ./services/crawler
    env_file: ./services/crawler/.env
    environment:
      DATABASE_URL: postgresql://blackbox:blackbox@postgres:5432/blackbox
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  matching-agent:
    build: ./services/matching-agent
    env_file: ./services/matching-agent/.env
    environment:
      DATABASE_URL: postgresql://blackbox:blackbox@postgres:5432/blackbox
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scoring-agent:
    build: ./services/scoring-agent
    env_file: ./services/scoring-agent/.env
    environment:
      DATABASE_URL: postgresql://blackbox:blackbox@postgres:5432/blackbox
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
